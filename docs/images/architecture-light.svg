<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="t">Audiops architecture</title>
<desc id="d">The shared Kotlin Multiplatform module holds the Compose UI, the AudiopsViewModel and the AudioEngine interface. JvmAudioEngine in jvmShared implements it with the streaming DSP core. The Android and desktop engines extend JvmAudioEngine and add decoding and, on Android, the AI models.</desc>
<defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7A6AD8"/></marker></defs>
<rect width="1200" height="760" rx="28" fill="#FDFBFF"/>
<rect x="32" y="32" width="1136" height="436" rx="24" fill="#F2EEFF" stroke="#C9C0F2" stroke-width="1.5" stroke-dasharray="7 6"/>
<text x="60" y="70" font-size="22" font-weight="800" fill="#1C1B22">shared</text>
<text x="148" y="70" font-size="16" fill="#5E5A6E">Kotlin Multiplatform · one codebase for Android, Linux and Windows</text>
<rect x="60" y="96" width="320" height="160" rx="18" fill="#FFFFFF" stroke="#D8D1F5" stroke-width="1.5"/>
<text x="82" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#5B47C8">commonMain / ui</text>
<text x="82" y="154" font-size="20" font-weight="700" fill="#1C1B22">Compose UI</text>
<text x="82" y="182" font-size="15" fill="#5E5A6E">Material 3 Expressive</text>
<text x="82" y="205" font-size="15" fill="#5E5A6E">Stateless screens</text>
<text x="82" y="228" font-size="15" fill="#5E5A6E">Tools · Activity · Settings</text>
<rect x="440" y="96" width="320" height="160" rx="18" fill="#FFFFFF" stroke="#D8D1F5" stroke-width="1.5"/>
<text x="462" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#5B47C8">commonMain</text>
<text x="462" y="154" font-size="20" font-weight="700" fill="#1C1B22">AudiopsViewModel</text>
<text x="462" y="182" font-size="15" fill="#5E5A6E">Immutable AudiopsState</text>
<text x="462" y="205" font-size="15" fill="#5E5A6E">Job queue, one worker</text>
<text x="462" y="228" font-size="15" fill="#5E5A6E">History and settings (DataStore)</text>
<rect x="820" y="96" width="320" height="160" rx="18" fill="#FFFFFF" stroke="#D8D1F5" stroke-width="1.5"/>
<text x="842" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#5B47C8">commonMain</text>
<text x="842" y="154" font-size="20" font-weight="700" fill="#1C1B22">AudioEngine</text>
<text x="842" y="182" font-size="15" fill="#5E5A6E">The only platform boundary</text>
<text x="842" y="205" font-size="15" fill="#5E5A6E">process · analyze · enhance</text>
<text x="842" y="228" font-size="15" fill="#5E5A6E">transcribe · waveform</text>
<line x1="382" y1="160" x2="436" y2="160" stroke="#7A6AD8" stroke-width="2.5" marker-end="url(#head)"/>
<line x1="436" y1="196" x2="384" y2="196" stroke="#7A6AD8" stroke-width="2.5" marker-end="url(#head)"/>
<text x="409" y="150" text-anchor="middle" font-size="13" font-weight="600" fill="#5E5A6E">events</text>
<text x="409" y="216" text-anchor="middle" font-size="13" font-weight="600" fill="#5E5A6E">state</text>
<line x1="762" y1="176" x2="816" y2="176" stroke="#7A6AD8" stroke-width="2.5" marker-end="url(#head)"/>
<text x="789" y="166" text-anchor="middle" font-size="13" font-weight="600" fill="#5E5A6E">jobs</text>
<rect x="60" y="300" width="1080" height="140" rx="18" fill="#EAE4FF" stroke="#5B47C8" stroke-width="1.5"/>
<text x="82" y="330" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#5B47C8">jvmShared</text>
<text x="82" y="358" font-size="20" font-weight="700" fill="#1C1B22">JvmAudioEngine · streaming DSP core</text>
<text x="82" y="386" font-size="15" fill="#5E5A6E">Equalizer, noise reduction, WSOLA speed and pitch, resampler, limiter, BS.1770 loudness, silence gate</text>
<text x="82" y="409" font-size="15" fill="#5E5A6E">WAV and PCM I/O · decode cache · verified model downloads · constant memory, pure Kotlin</text>
<line x1="980" y1="298" x2="980" y2="260" stroke="#7A6AD8" stroke-width="2.5" marker-end="url(#head)"/>
<text x="992" y="285" text-anchor="start" font-size="14" font-weight="600" fill="#5E5A6E">implements</text>
<rect x="60" y="540" width="520" height="188" rx="18" fill="#FFFFFF" stroke="#D8D1F5" stroke-width="1.5"/>
<text x="82" y="570" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#5B47C8">app · Android 8.0+</text>
<text x="82" y="598" font-size="20" font-weight="700" fill="#1C1B22">AndroidAudioEngine</text>
<text x="82" y="626" font-size="15" fill="#5E5A6E">MediaCodec decoder (MP3, AAC, OGG, FLAC…)</text>
<text x="82" y="649" font-size="15" fill="#5E5A6E">Resemble Enhance (LiteRT) in the :enhance process</text>
<text x="82" y="672" font-size="15" fill="#5E5A6E">Whisper / Bangla Zipformer (sherpa-onnx)</text>
<text x="82" y="695" font-size="15" fill="#5E5A6E">System pickers, dynamic colour</text>
<rect x="620" y="540" width="520" height="188" rx="18" fill="#FFFFFF" stroke="#D8D1F5" stroke-width="1.5"/>
<text x="642" y="570" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#5B47C8">desktopApp · Linux, Windows</text>
<text x="642" y="598" font-size="20" font-weight="700" fill="#1C1B22">DesktopAudioEngine</text>
<text x="642" y="626" font-size="15" fill="#5E5A6E">Java Sound decoding (WAV, AIFF, AU)</text>
<text x="642" y="649" font-size="15" fill="#5E5A6E">AWT file dialogs, Java Sound playback</text>
<text x="642" y="672" font-size="15" fill="#5E5A6E">DEB · RPM · MSI · EXE installers (jpackage)</text>
<text x="642" y="695" font-size="15" fill="#5E5A6E">AI tools planned</text>
<line x1="320" y1="538" x2="320" y2="444" stroke="#7A6AD8" stroke-width="2.5" marker-end="url(#head)"/>
<line x1="880" y1="538" x2="880" y2="444" stroke="#7A6AD8" stroke-width="2.5" marker-end="url(#head)"/>
