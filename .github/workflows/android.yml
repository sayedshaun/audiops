name: Build and test

# Runs on every pull request to main and on every push to main. Mark the "Format and style",
# "Unit tests" and "Android lint and build" checks as required in the branch protection rule
# for main, so a pull request can only merge when all three pass.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format and style
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: ktlint (Spotless)
        run: ./gradlew --no-daemon spotlessCheck
      - name: How to fix
        if: failure()
        run: echo "::error::Formatting problems found. Run 'make format' locally, commit the result and push."

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Shared and desktop tests
        run: ./gradlew --no-daemon :shared:desktopTest :desktopApp:test
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/
            shared/build/test-results/
            desktopApp/build/reports/tests/
            desktopApp/build/test-results/
          if-no-files-found: ignore

  android:
    name: Android lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # The runner image ships an Android SDK (ANDROID_HOME); Gradle installs missing platforms.
      - uses: gradle/actions/setup-gradle@v4
      - name: Android lint and debug build
        run: ./gradlew --no-daemon :app:lintDebug :app:assembleDebug
      - name: Release build (R8 and resource shrinking)
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: app/build/reports/
          if-no-files-found: ignore
