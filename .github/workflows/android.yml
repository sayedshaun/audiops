name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner image ships an Android SDK (ANDROID_HOME); Gradle installs missing platforms.
      - uses: gradle/actions/setup-gradle@v4

      - name: Shared and desktop tests
        run: ./gradlew --no-daemon :shared:desktopTest :desktopApp:test

      - name: Android lint and debug build
        run: ./gradlew --no-daemon :app:lintDebug :app:assembleDebug

      - name: Release build (R8 and resource shrinking)
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            shared/build/reports/
            shared/build/test-results/
            desktopApp/build/test-results/
          if-no-files-found: ignore
