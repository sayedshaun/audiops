name: Feature request
description: Suggest a tool or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the task or problem, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Audiops help?
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options: [Android, Linux, Windows]
