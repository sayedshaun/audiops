name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      options: [Enhance speech, Transcribe, Noise reduction, Remove silence, Trim, Fade, Volume, Speed and pitch, Equalizer, Convert, Analyze, Activity, Settings, Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings → About → Version
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS
      placeholder: Pixel 8, Android 16 / Ubuntu 24.04 / Windows 11
    validations:
      required: true
  - type: input
    id: input
    attributes:
      label: Input file
      placeholder: MP3, 44.1 kHz stereo, 12 minutes
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Optional. Please don't attach recordings with private speech.
